<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMORI Battle - Task 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 m-0 overflow-hidden">

    <div class="omori-stage position-relative w-100 h-100 shadow-lg">
        
        <div class="hero-status-card p-2">
            <div class="status-header text-center fw-bold mb-1">NEUTRAL</div>
            <div class="text-center mb-2">
                <img id="heroImage" src="images/omori.png" alt="OMORI" class="img-fluid border border-dark" style="width: 80px; height: 80px; object-fit: cover;">
            </div>
            <div class="mb-1">
                <div class="d-flex justify-content-between small fw-bold text-danger"><span>❤️ HP</span><span id="heroHpText">100/100</span></div>
                <div class="progress rounded-0" style="height: 10px;"><div id="heroHpBar" class="progress-bar bg-danger" style="width: 100%"></div></div>
            </div>
        </div>

        <div class="enemy-status-card p-2">
            <div class="status-header text-center fw-bold mb-1">SOMETHING</div>
            <div class="mb-1">
                <div class="d-flex justify-content-between small fw-bold text-danger"><span>❤️ HP</span><span id="enemyHpText">100/100</span></div>
                <div class="progress rounded-0" style="height: 10px;"><div id="enemyHpBar" class="progress-bar bg-danger" style="width: 100%"></div></div>
            </div>
        </div>

        <div class="enemy-container position-absolute top-50 start-50 translate-middle text-center">
            <img id="enemyImage" src="images/enemy.png" alt="Enemy" class="enemy-sprite">
        </div>

        <div class="omori-bottom-panel position-absolute bottom-0 start-0 w-100 p-3">
            <div id="logBox" class="omori-log mb-2 text-white px-2 py-1">
                The battle has begun. Stay focused.
            </div>

            <div id="actionButtons" class="row g-2">
                <div class="col-6">
                    <button id="attackBtn" class="btn omori-action-btn w-100 py-2">⚔️ ATTACK</button>
                </div>
                <div class="col-6">
                    <button id="defendBtn" class="btn omori-action-btn w-100 py-2">🛡️ DEFEND</button>
                </div>
                <div class="col-12">
                    <button id="healBtn" class="btn omori-action-btn w-100 py-2">✨ HEAL (<span id="healCount">3</span>)</button>
                </div>
            </div>

            <div id="restartContainer" class="d-none text-center">
                <button id="restartBtn" class="btn btn-light w-100 fw-bold rounded-0 py-2">RETRY</button>
            </div>
        </div>
    </div>

    <script src="main.js" defer></script>
</body>
</html>
