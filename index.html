<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMORI Battle - Task 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
        }
        .omori-card {
            background-color: #1a1a1a;
            border: 2px solid #e0e0e0;
            border-radius: 0px;
            box-shadow: 5px 5px 0px #333;
        }
        .btn-omori {
            background-color: #000;
            color: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 0px;
            font-weight: bold;
            transition: 0.1s;
        }
        .btn-omori:hover:not(:disabled) {
            background-color: #e0e0e0;
            color: #000;
        }
        .btn-omori:disabled {
            background-color: #333;
            color: #777;
            border-color: #555;
        }
        .progress {
            background-color: #333;
            border-radius: 0;
            height: 20px;
            border: 1px solid #777;
        }
        .progress-bar {
            background-color: #e0e0e0;
        }
        .log-box {
            background-color: #0d0d0d;
            border: 1px dashed #777;
            height: 150px;
            overflow-y: auto;
            font-size: 0.9rem;
            padding: 10px;
        }
    </style>
</head>
<body class="p-4 d-flex justify-content-center align-items-center min-vh-100">

    <div class="container" style="max-width: 600px;">
        <h3 class="text-center mb-4 text-uppercase tracking-wide">SOMETHING AWAITS...</h3>
        
        <div class="card omori-card p-4 mb-3">
            <div class="row mb-3">
                <div class="col-6">
                    <p class="mb-1 fw-bold">OMORI (HP: <span id="heroHpText">100</span>/100)</p>
                    <div class="progress">
                        <div id="heroHpBar" class="progress-bar" style="width: 100%"></div>
                    </div>
                </div>
                <div class="col-6">
                    <p class="mb-1 fw-bold">SOMETHING (HP: <span id="enemyHpText">100</span>/100)</p>
                    <div class="progress">
                        <div id="enemyHpBar" class="progress-bar bg-danger" style="width: 100%"></div>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <p class="text-muted mb-1 small">MIND LOG:</p>
                <div id="logBox" class="log-box">
                    <div>Битва началась. Сосредоточьтесь.</div>
                </div>
            </div>

            <div id="actionButtons" class="d-grid gap-2 d-md-flex justify-content-md-between">
                <button id="attackBtn" class="btn btn-omori flex-grow-1 py-2">ATK (Атака)</button>
                <button id="defendBtn" class="btn btn-omori flex-grow-1 py-2">DEF (Защита)</button>
                <button id="healBtn" class="btn btn-omori flex-grow-1 py-2">HL (Лечение: <span id="healCount">3</span>)</button>
            </div>

            <div id="restartContainer" class="d-none mt-3">
                <button id="restartBtn" class="btn btn-light w-100 fw-bold rounded-0">НАЧАТЬ ЗАНОВО (RETRY)</button>
            </div>
        </div>
    </div>

    <script>
        const MAX_HP = 100;
        const HERO_MIN_ATK = 8;
        const HERO_MAX_ATK = 15;
        const ENEMY_MIN_ATK = 5;
        const ENEMY_MAX_ATK = 14;
        const HEAL_AMOUNT = 20;
        const MAX_HEALS = 3;
        const CRIT_CHANCE = 0.1;

        let heroHp = MAX_HP;
        let enemyHp = MAX_HP;
        let healsLeft = MAX_HEALS;
        let isDefending = false;
        let actionLog = ["Битва началась. Сосредоточьтесь."];

        const heroHpText = document.getElementById('heroHpText');
        const heroHpBar = document.getElementById('heroHpBar');
        const enemyHpText = document.getElementById('enemyHpText');
        const enemyHpBar = document.getElementById('enemyHpBar');
        const logBox = document.getElementById('logBox');
        const healCountSpan = document.getElementById('healCount');
        const actionButtons = document.getElementById('actionButtons');
        const restartContainer = document.getElementById('restartContainer');

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function updateUI() {
            heroHpText.textContent = heroHp;
            heroHpBar.style.width = Math.max(0, heroHp) + '%';
            
            enemyHpText.textContent = enemyHp;
            enemyHpBar.style.width = Math.max(0, enemyHp) + '%';
            
            healCountSpan.textContent = healsLeft;

            logBox.innerHTML = actionLog.map(msg => `<div>${msg}</div>`).join('');
            logBox.scrollTop = logBox.scrollHeight;
        }

        function pushLog(message) {
            actionLog.push(message);
            if (actionLog.length > 5) {
                actionLog.shift();
            }
        }

        function enemyTurn() {
            if (checkGameOver()) return;

            let damage = getRandomInt(ENEMY_MIN_ATK, ENEMY_MAX_ATK);
            let isCrit = Math.random() < CRIT_CHANCE;

            if (isCrit && !isDefending) {
                damage *= 2;
                pushLog(`[КРИТ!] Враг наносит яростный удар на ${damage} урона!`);
            } else if (isDefending || damage < 7) {
                if (isDefending) {
                    damage = Math.floor(damage / 2);
                    pushLog(`Омори защитился! Урон уменьшен до ${damage}.`);
                } else {
                    pushLog(`Враг нанес слабый удар на ${damage} урона.`);
                }
            } else {
                pushLog(`Враг атакует и наносит ${damage} урона.`);
            }

            heroHp -= damage;
            if (heroHp < 0) heroHp = 0;

            isDefending = false;
            checkGameOver();
            updateUI();
        }

        function checkGameOver() {
            if (heroHp <= 0 || enemyHp <= 0) {
                if (heroHp <= 0 && enemyHp <= 0) {
                    pushLog("Ничья... Вы оба пали во тьму.");
                } else if (heroHp <= 0) {
                    pushLog("Вы проиграли... Преодолейте свой страх в следующий раз.");
                } else if (enemyHp <= 0) {
                    pushLog("ПОБЕДА! Враг рассеян в темноте.");
                }
                
                actionButtons.classList.add('d-none');
                restartContainer.classList.remove('d-none');
                return true;
            }
            return false;
        }

        document.getElementById('attackBtn').addEventListener('click', () => {
            let damage = getRandomInt(HERO_MIN_ATK, HERO_MAX_ATK);
            enemyHp -= damage;
            if (enemyHp < 0) enemyHp = 0;

            pushLog(`Омори атакует и наносит ${damage} урона.`);
            
            if (!checkGameOver()) {
                setTimeout(enemyTurn, 400);
            }
            updateUI();
        });

        document.getElementById('defendBtn').addEventListener('click', () => {
            isDefending = true;
            pushLog("Омори принимает защитную стойку.");

            if (!checkGameOver()) {
                setTimeout(enemyTurn, 400);
            }
            updateUI();
        });

        document.getElementById('healBtn').addEventListener('click', () => {
            if (healsLeft > 0 && heroHp < MAX_HP) {
                heroHp += HEAL_AMOUNT;
                if (heroHp > MAX_HP) heroHp = MAX_HP;
                healsLeft--;
                pushLog(`Омори восстановил ${HEAL_AMOUNT} HP. Осталось лечений: ${healsLeft}`);
                
                if (!checkGameOver()) {
                    setTimeout(enemyTurn, 400);
                }
            } else {
                pushLog("Лечение невозможно: здоровье полное или кончились заряды!");
            }
            updateUI();
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            heroHp = MAX_HP;
            enemyHp = MAX_HP;
            healsLeft = MAX_HEALS;
            isDefending = false;
            actionLog = ["Вы проснулись снова. Начинайте бой."];

            restartContainer.classList.add('d-none');
            actionButtons.classList.remove('d-none');
            updateUI();
        });

        updateUI();
    </script>
</body>
</html>
